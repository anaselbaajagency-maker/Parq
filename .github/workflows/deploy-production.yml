name: Deploy (Production)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH (pull + build on server)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail

            cd "${{ secrets.DEPLOY_PATH }}"

            echo "==> Updating repo (main)"
            git fetch origin
            git checkout main
            git pull --ff-only origin main

            echo "==> Backend (Laravel)"
            cd backend-laravel
            composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "==> Frontend (Next.js)"
            cd ../frontend
            npm ci
            NEXT_PUBLIC_API_URL="${{ secrets.FRONTEND_API_URL }}" npm run build

            echo "==> Restart services (customize for your server)"
            echo "Example: sudo systemctl restart php8.3-fpm nginx"
            echo "Example: pm2 reload parq-frontend"

